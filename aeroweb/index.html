<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Aeroweb 27 - Explore academic resources for B.Tech/Dual Degree students of Department of Aerospace Engineering, Indian Institute of Technology, Kharagpur."
        />
        <meta
            name="keywords"
            content="Aerospace Engineering, Academics, Aeroeweb27 github, github aeroweb, aeroweb github, github aeroweb27, Feedback, IIT KGP, IIT Kharagpur, Aeroweb 27, Aerospace, Engineering, B.Tech, Dual Degree, IIT, Kharagpur, Indian Institute of Technology, Indian Institute of Technology Kharagpur, Indian Institute of Technology, Kharagpur, IIT Kharagpur, IIT KGP, IIT Kharagpur Aerospace Engineering, IIT KGP Aerospace Engineering, Aerospace Engineering IIT Kharagpur, Aerospace Engineering IIT KGP, Aerospace Engineering IIT"
        />
        <meta name="author" content="Dheeraj" />
        <link rel="stylesheet" href="style.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
        <style>
            .material-symbols-outlined {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 400,
                    "GRAD" 0,
                    "opsz" 24;
            }
        </style>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Gruppo&family=Jaro:opsz@6..72&family=Jersey+10+Charted&family=Orbitron:wght@400..900&display=swap"
            rel="stylesheet"
        />

        <link
            rel="shortcut icon"
            href="./images/aeroweb27_icon.png"
            type="image/x-icon"
        />
        <title>Aeroweb 27</title>
    </head>

    <body>
        <div class="container-fluid">
            <div class="row navbox">
                <nav class="col-12 position-fixed" style="z-index: 10">
                    <a href="#"
                        ><img
                            src="./images/aeroweb27_icon.png"
                            alt="logo"
                    /></a>
                    <div class="title">Department of Aerospace Engineering</div>
                    <input
                        type="text"
                        id="inputbox"
                        class="inputbox"
                        name="inputbox"
                        placeholder="Search is not available yet..."
                    />
                    <!-- What are you looking for... -->
                    <a href="#" id="search" class="search p-2">
                        <div class="material-symbols-outlined">search</div>
                    </a>
                </nav>
            </div>

            <div class="row">
                <div class="col-12 mt-5 pt-5 imagebox">
                    <img
                        src="./images/aeroweb27_banner.png"
                        alt="logo"
                    />
                </div>
                <div class="col-12 text-center">
                    <a href="#skipScroll"
                        ><img
                            src="./images/down_arrow.png"
                            class="expand_more"
                            alt="down"
                    /></a>
                </div>
                <!-- <div class="col material-symbols-outlined text-center expand_more">expand_more</div> -->
            </div>
            <div id="skipScroll">
                <h1 class="heading1">Academics</h1>
            </div>

            <div class="row row-cols-1 row-gap-5 semesters" id="semesters">
                <div class="col books clmn">
                    <a
                        href="https://drive.google.com/drive/folders/1VlPl4vyQ7P1oynns36pF0dnRzs2v8zvc?usp=sharing"
                        target="_blank"
                        class="mlink"
                    >
                        <div class="bookCard genCard">
                            <img
                                src="./images/book_image.png"
                                alt="Books"
                                style="height: 100%; width: 100%"
                            />
                        </div>
                    </a>
                </div>
            </div>

            <div class="formdiv">
                <div class="formname">
                    <div class="befAftFeedBtn"></div>
                    <div id="feedbtn">Feedback and Suggestions</div>
                    <div class="befAftFeedBtn"></div>
                </div>
                <form id="feedform" class="feedform">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        class="input"
                        required
                    /><br />
                    <label for="rollnum">Roll Number</label>
                    <input
                        type="text"
                        id="rollnum"
                        name="rollnum"
                        placeholder="Enter your Roll Number"
                        class="input"
                        required
                    /><br />
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your Email"
                        class="input"
                        required
                    /><br />
                    <label for="feedback">Feedback/Suggestion</label>
                    <textarea
                        name="feedback"
                        id="feedback"
                        placeholder="Enter the feedback/Suggestion..."
                        class="input textarea"
                        required
                    ></textarea
                    ><br />

                    <!-- <input type="submit" value="Submit" id="submitbtn"> -->
                    <span
                        id="submsnmsg"
                        style="
                            background-color: whitesmoke;
                            color: black;
                            font-size: 1.2rem;
                            font-weight: 600;
                            visibility: hidden;
                        "
                    ></span
                    ><br />
                    <span id="submitbtn" style="text-align: center"
                        >Submit</span
                    >
                </form>
            </div>

            <div class="footer">
                <div class="px-2">Created By Dheeraj</div>
                <div class="px-2" id="visiters">Visiters:</div>
            </div>
        </div>

        <!-- info train -->
        <div class="infotrain" id="infotrain">
            <div class="infotext">
                The Material for
                <span style="color: green; background-color: whitesmoke"
                    >SEMESTER 8</span
                >
                has been added....
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/platform/1.3.6/platform.min.js"></script>
        <script src="script.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
